name: devTeardown

on:
  delete:

jobs:
  teardown:
    if: github.event.ref_type == 'branch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Delete namespace
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          NAMESPACE=$(sh deployment/namespace.sh "$BRANCH")
          kubectl delete namespace "$NAMESPACE" --ignore-not-found
